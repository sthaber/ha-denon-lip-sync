# Denon lip sync — Home Assistant package.
#
# Sets the receiver's audio delay for one input based on the frame rate and
# HDR type of the video coming into it. Each combination gets its own delay
# setting, editable from the dashboard while the matching video plays.
#
# Install: see https://github.com/sthaber/ha-denon-lip-sync
#
# One thing to edit: the input your source is plugged into, at the end of
# the sensor's `command:` below (AUX1). Use the receiver's internal name
# (AUX1, MPLAY, GAME, BD, SAT/CBL, ...), not the name you gave it: select
# the input and read `input` off sensor.denon_lip_sync_format.
#
# Every other input is held at 0 ms.

# Writes go through denon.py rather than the denonavr integration, so the
# script can check which input is selected immediately before sending.
shell_command:
  denon_lip_sync_set: 'python3 /config/ha-denon-lip-sync/denon.py set {{ input }} {{ delay }}'

command_line:
  - sensor:
      name: Denon Lip Sync Format
      unique_id: denon_lip_sync_format
      command: 'python3 /config/ha-denon-lip-sync/denon.py AUX1'
      command_timeout: 3
      scan_interval: 3
      value_template: "{{ value_json.format | default('unknown') }}"
      json_attributes:
        - input
        - watched_input
        - resolution
        - frame_rate
        - hdr
        - delay
        - error

# One delay per frame rate and HDR type, plus a default for anything else
# (25 or 30 Hz from sources that send them, HLG, ...). An Apple TV sends
# 25 fps video at 50 Hz and 30 fps at 60 Hz, so those are covered. Values live in HA's saved state, not in this file, so
# your tuning survives restarts and updates to this package.
input_number:
  lip_sync_24_sdr:
    name: Lip Sync 24 Hz SDR
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_24_hdr10:
    name: Lip Sync 24 Hz HDR10
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_24_dolby_vision:
    name: Lip Sync 24 Hz Dolby Vision
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_50_sdr:
    name: Lip Sync 50 Hz SDR
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_50_hdr10:
    name: Lip Sync 50 Hz HDR10
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_50_dolby_vision:
    name: Lip Sync 50 Hz Dolby Vision
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_60_sdr:
    name: Lip Sync 60 Hz SDR
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_60_hdr10:
    name: Lip Sync 60 Hz HDR10
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_60_dolby_vision:
    name: Lip Sync 60 Hz Dolby Vision
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box
  lip_sync_default:
    name: Lip Sync Default
    icon: mdi:timer-music-outline
    min: 0
    max: 500
    step: 1
    unit_of_measurement: ms
    mode: box

automation:
  - id: denon_lip_sync_apply
    alias: Denon lip sync - keep the audio delay matched to the video
    description: >-
      Keeps the selected input's audio delay where it should be: the matching
      Lip Sync setting on the watched input, 0 ms on every other input.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.denon_lip_sync_format
      - trigger: state
        entity_id: sensor.denon_lip_sync_format
        attribute: input
      - trigger: state
        entity_id: sensor.denon_lip_sync_format
        attribute: delay
      - trigger: state
        entity_id:
          - input_number.lip_sync_24_sdr
          - input_number.lip_sync_24_hdr10
          - input_number.lip_sync_24_dolby_vision
          - input_number.lip_sync_50_sdr
          - input_number.lip_sync_50_hdr10
          - input_number.lip_sync_50_dolby_vision
          - input_number.lip_sync_60_sdr
          - input_number.lip_sync_60_hdr10
          - input_number.lip_sync_60_dolby_vision
          - input_number.lip_sync_default
    variables:
      sensor: sensor.denon_lip_sync_format
      input: "{{ state_attr(sensor, 'input') }}"
      watched: "{{ input == state_attr(sensor, 'watched_input') }}"
      video_format: "{{ states(sensor) }}"
      setting: "input_number.lip_sync_{{ video_format }}"
      target: >-
        {{ 0 if not watched
           else (states(setting) if has_value(setting)
                 else states('input_number.lip_sync_default')) | int }}
      current: "{{ state_attr(sensor, 'delay') }}"
    conditions:
      - "{{ input is string and current is number }}"
      # With no video on the watched input there's no format to match, so
      # leave its delay alone.
      - "{{ not watched or video_format not in ['none', 'unknown', 'unavailable'] }}"
      - "{{ target != current }}"
    actions:
      - action: shell_command.denon_lip_sync_set
        data:
          input: "{{ input }}"
          delay: "{{ target }}"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.denon_lip_sync_format
